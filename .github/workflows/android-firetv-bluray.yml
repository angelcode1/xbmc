name: Gazelle Unified Kodi Core - Blu-ray AACS and Dolby FEL

on:
  workflow_call:
    inputs:
      build_mode:
        description: "Build scope"
        type: string
        required: false
        default: routing-core
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build scope"
        type: choice
        required: true
        default: routing-core
        options:
          - depends-only
          - routing-core
  push:
    branches:
      - android-firetv-unified
    paths:
      - ".github/workflows/android-firetv-bluray.yml"
      - "cmake/platform/android/**"
      - "tools/depends/**"
      - "xbmc/**"
      - "docs/firetv-android-bluray-notes.md"

permissions:
  contents: read

concurrency:
  group: android-firetv-bluray-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-armv7:
    name: Android ARMv7 FireTV libbluray/APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      HOST: arm-linux-androideabi
      BUILD_MODE: ${{ inputs.build_mode || github.event.inputs.build_mode || 'routing-core' }}
      DEBIAN_FRONTEND: noninteractive
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      TARBALLS: ${{ github.workspace }}/xbmc-tarballs
      DEPENDS_PREFIX: ${{ github.workspace }}/xbmc-depends
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      MAKEFLAGS: -j2

    steps:
      - name: Checkout public Kodi fork
        uses: actions/checkout@v4
        with:
          repository: angelcode1/xbmc
          # On this repository, build precisely the triggering commit, not the
          # stale 'android-firetv-fel' branch. Preserve cube3's external-call pin.
          ref: ${{ github.repository == 'angelcode1/xbmc' && github.sha || 'android-firetv-unified' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out Kodi source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "GAZELLE_SOURCE_SHA=$actual"
          echo "GAZELLE_WORKFLOW_SHA=${{ github.sha }}"
          if [ "${{ github.repository }}" = "angelcode1/xbmc" ] && [ "$actual" != "${{ github.sha }}" ]; then
            echo "::error::Kodi source checkout does not match workflow commit"
            exit 1
          fi

      - name: Assert combined source and nondeployable public routing-core scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" != "routing-core" ] && [ "$BUILD_MODE" != "depends-only" ]; then
            echo "::error::Unified Kodi public job only supports routing-core or depends-only."
            exit 2
          fi
          test -f tools/depends/target/libbluray/gazelle-aacs-gate-v1.py
          test -f tools/depends/target/libbluray/005-android-libmmbd-unversioned-dlopen.patch
          grep -q 'gazelle-aacs-gate-v1.py' tools/depends/target/libbluray/Makefile
          grep -q 'GAZELLE_AACS_GATE_V1' tools/depends/target/libbluray/gazelle-aacs-gate-v1.py
          grep -q 'GAZELLE_DOVI_CAPABILITIES' xbmc/cores/VideoPlayer/DVDCodecs/Video/DVDVideoCodecAndroidMediaCodec.cpp
          grep -q 'GAZELLE_DOVI_MEDIAFORMAT' xbmc/cores/VideoPlayer/DVDCodecs/Video/DVDVideoCodecAndroidMediaCodec.cpp
          test -f xbmc/cores/VideoPlayer/DVDInputStreams/DVDInputStreamBluray.cpp
          echo "GAZELLE_UNIFIED_SOURCE_GATE_PASS aacs=1 bluray_vfs=1 dolby_fel=1"
          echo "GAZELLE_PUBLIC_ROUTING_CORE_ONLY_PRIVATE_OPTICAL_COMPONENTS_REQUIRED=1"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host packages
        run: |
          set -eux
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            cmake \
            curl \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            lib32stdc++6 \
            lib32z1 \
            lib32z1-dev \
            libcurl4-openssl-dev \
            libtool \
            meson \
            ninja-build \
            openjdk-17-jdk \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Android command line tools and NDK r28c
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L -o /tmp/android-commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          ls -la "$ANDROID_SDK_ROOT/ndk"

      - name: Restore stable debug signing key or generate temporary key
        env:
          GAZELLE_DEBUG_KEYSTORE_B64: ${{ secrets.GAZELLE_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "$GAZELLE_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$GAZELLE_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            # This workflow signs via the conventional Android debug keystore.
            # Reject incorrectly encoded or unrelated keys instead of silently
            # falling back to a fresh, incompatible signing certificate.
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey >/dev/null
            echo "GAZELLE_SIGNING_KEY_SOURCE=repository_secret"
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "::warning::No GAZELLE_DEBUG_KEYSTORE_B64 secret: APK will have an ephemeral certificate; upgrades across CI runs can fail."
            echo "GAZELLE_SIGNING_KEY_SOURCE=ephemeral"
          fi

      - name: Bootstrap and configure Android depends
        run: |
          set -eux
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$TARBALLS" \
            --host="$HOST" \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            --prefix="$DEPENDS_PREFIX" \
            --disable-ccache

      - name: Build Android depends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/gazelle-ci-logs"
          logfile="$GITHUB_WORKSPACE/gazelle-ci-logs/android-depends.log"
          echo "GAZELLE_DEPENDS_START quiet=1 logfile=$logfile"
          df -h "$GITHUB_WORKSPACE"
          free -m
          make -C tools/depends -j2 V=0 >"$logfile" 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 75
            echo "GAZELLE_DEPENDS_HEARTBEAT pid=$build_pid log_bytes=$(wc -c < "$logfile")"
            df -h "$GITHUB_WORKSPACE" | tail -n 1
            free -m | grep -E 'Mem:|Swap:' || true
            tail -n 1 "$logfile" | cut -c 1-200 || true
          done
          if wait "$build_pid"; then
            echo "GAZELLE_DEPENDS_BUILD_PASS"
            tail -n 35 "$logfile"
          else
            status=$?
            echo "GAZELLE_DEPENDS_BUILD_FAIL exit=$status"
            grep -E -i '(fatal error|\berror:|\*\*\*|no space left|killed|failed|out of memory)' "$logfile" | tail -n 100 || true
            tail -n 130 "$logfile"
            exit "$status"
          fi

      - name: Verify libbluray and udfread depends output
        run: |
          set -eux
          echo "== depends lib dir =="
          find "$DEPENDS_PREFIX" -maxdepth 4 \( -iname '*bluray*' -o -iname '*udf*' -o -iname '*aacs*' -o -iname '*bdplus*' \) -print | sort || true
          echo "== depends pkgconfig/cmake hints =="
          find "$DEPENDS_PREFIX" -maxdepth 6 \( -iname '*bluray*.pc' -o -iname '*udf*.pc' -o -iname '*aacs*.pc' -o -iname '*bdplus*.pc' -o -iname '*bluray*config*.cmake' \) -print | sort || true

      - name: Configure Kodi CMake build
        if: env.BUILD_MODE == 'routing-core'
        run: |
          set -eux
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Build Kodi
        if: env.BUILD_MODE == 'routing-core'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/gazelle-ci-logs"
          logfile="$GITHUB_WORKSPACE/gazelle-ci-logs/kodi-core.log"
          echo "GAZELLE_KODI_BUILD_START quiet=1 logfile=$logfile"
          df -h "$GITHUB_WORKSPACE"
          make -C "$BUILD_DIR" -j2 >"$logfile" 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 75
            echo "GAZELLE_KODI_HEARTBEAT pid=$build_pid log_bytes=$(wc -c < "$logfile")"
            df -h "$GITHUB_WORKSPACE" | tail -n 1
            free -m | grep -E 'Mem:|Swap:' || true
            tail -n 1 "$logfile" | cut -c 1-200 || true
          done
          if wait "$build_pid"; then
            echo "GAZELLE_KODI_CORE_BUILD_PASS"
            tail -n 35 "$logfile"
          else
            status=$?
            echo "GAZELLE_KODI_CORE_BUILD_FAIL exit=$status"
            grep -E -i '(fatal error|\berror:|\*\*\*|no space left|killed|failed|out of memory)' "$logfile" | tail -n 100 || true
            tail -n 130 "$logfile"
            exit "$status"
          fi

      - name: Check compiled Blu-ray defines
        if: env.BUILD_MODE == 'routing-core'
        run: |
          set -eux
          grep -R "HAVE_LIBBLURAY\|HAS_UDFREAD" "$BUILD_DIR" CMakeFiles 2>/dev/null | head -80 || true

      - name: Package APK
        if: env.BUILD_MODE == 'routing-core'
        run: |
          set -eux
          make -C "$BUILD_DIR" apk
          find "$GITHUB_WORKSPACE" -iname '*.apk' -print -exec ls -lh {} \;

      - name: Mark public routing core as not integrated
        if: env.BUILD_MODE == 'routing-core'
        run: |
          echo "::warning::This Kodi APK is a unified AACS+FEL routing core only. It omits private optical/LibMMBD integration. Do not install as the final Cube3 test APK; use the Cube3 unified packaging workflow."
          echo "GAZELLE_PUBLIC_ROUTING_CORE_ONLY=1"

      - name: Upload APKs
        if: env.BUILD_MODE == 'routing-core'
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-firetv-${{ github.run_id }}-routing-core-armv7-apk
          path: |
            **/*.apk
          if-no-files-found: error

      - name: Upload configure/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-firetv-${{ github.ref_name }}-armv7-logs
          path: |
            tools/depends/config.log
            kodi-build/**/*.log
            xbmc-depends/**/*.log
            gazelle-ci-logs/*.log
          if-no-files-found: ignore
