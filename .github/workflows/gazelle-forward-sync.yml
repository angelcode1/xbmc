name: Gazelle - propose upstream to unified Fire TV Kodi

# The parent-updated fork master is proposed to unified in a fresh staging PR.
# No merge/conflict resolution touches master or unified automatically.
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gazelle-forward-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Propose the parent-updated fork master to unified Kodi
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          master_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          unified_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/android-firetv-unified" --jq '.object.sha')"
          [[ "$master_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$unified_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2

          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/android-firetv-unified...master" --jq '.ahead_by')"
          [[ "$ahead" =~ ^[0-9]+$ ]] || exit 2
          if [ "$ahead" -eq 0 ]; then
            echo "GAZELLE_FORWARD_SYNC_ALREADY_UP_TO_DATE=1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Do not spam parallel sync PRs. An existing PR may need a manual
          # refresh after new master commits, before it is merged.
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base android-firetv-unified --state open --limit 100 \
            --json number,headRefName \
            --jq 'map(select(.headRefName | startswith("sync/kodi-master-to-unified-"))) | first | .number // empty')"
          if [ -n "$existing" ]; then
            echo "GAZELLE_FORWARD_SYNC_EXISTING_PR=$existing" >> "$GITHUB_STEP_SUMMARY"
            echo "Review/update the existing staging PR; no new branch created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A unique fork-owned staging branch points to master, while the
          # integration branch is untouched. GitHub's PR merge UI will show
          # conflicts. Fix those in the staging branch before any merge.
          branch="sync/kodi-master-to-unified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$branch" \
            -f "sha=$master_sha" --silent

          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base android-firetv-unified \
            --head "$branch" \
            --title "Review upstream Kodi sync into Blu-ray/AACS and Dolby FEL branch" \
            --body "Safe staging snapshot of fork master \`$master_sha\` into unified \`$unified_sha\`. This PR does not change either live branch and does not remove their commits. Resolve merge conflicts **on the sync staging branch** without overwriting Blu-ray/AACS, UDF or Dolby Vision FEL changes. Require Gazelle source-preservation CI and a full ARMv7 core build. Merge using **Create a merge commit**, never squash, force push or reset."; then
            echo "GAZELLE_FORWARD_SYNC_PR_CREATED=1" >> "$GITHUB_STEP_SUMMARY"
          else
            link="https://github.com/$GITHUB_REPOSITORY/compare/android-firetv-unified...$branch?expand=1"
            echo "::warning::GitHub Actions is not allowed to create PRs. Staging branch is preserved. Open the comparison URL manually."
            echo "GAZELLE_FORWARD_SYNC_PR_MANUAL_URL=$link" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "## Kodi upstream forward-sync staged"
            echo "Source fork master: \`$master_sha\`"
            echo "Target unified: \`$unified_sha\`"
            echo "Staging branch: \`$branch\`"
            echo "Merge status remains review-only; conflicting files must be resolved before merging."
          } >> "$GITHUB_STEP_SUMMARY"
