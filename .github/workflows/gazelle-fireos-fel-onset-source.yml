          s=Path("tools/gazelle-fel/capture-stage13-live-ports.sh").read_text()
          code="\n".join(l for l in s.splitlines() if not l.lstrip().startswith("#"))
          for bad in ("setprop ", "logcat -c", "adb push", "insmod ", "modprobe ", "echo 1 >", "pm install", "force-stop"):
              assert bad not in code, bad
          assert 'cat /sys/class/amstream/ports' in code
          assert 'active-1' in code and 'active-2' in code
          print("GAZELLE_STAGE13_HOST_CAPTURE_SOURCE_PASS")
          PY
          python3 -m py_compile tools/gazelle-fel/audit-stage15-mvc-index.py
          python3 tools/gazelle-fel/audit-stage15-mvc-index.py --selftest
