name: Android FireTV Blu-ray Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build scope"
        type: choice
        required: true
        default: full-apk
        options:
          - depends-only
          - full-apk
  push:
    branches:
      - android-firetv-bluray
      - android-firetv-fel
    paths:
      - ".github/workflows/android-firetv-bluray.yml"
      - "cmake/platform/android/**"
      - "tools/depends/**"
      - "xbmc/**"
      - "docs/firetv-android-bluray-notes.md"

permissions:
  contents: read

concurrency:
  group: android-firetv-bluray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-armv7:
    name: Android ARMv7 FireTV libbluray/APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      HOST: arm-linux-androideabi
      BUILD_MODE: ${{ github.event.inputs.build_mode || 'full-apk' }}
      DEBIAN_FRONTEND: noninteractive
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      TARBALLS: ${{ github.workspace }}/xbmc-tarballs
      DEPENDS_PREFIX: ${{ github.workspace }}/xbmc-depends
      BUILD_DIR: ${{ github.workspace }}/kodi-build
      MAKEFLAGS: -j2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host packages
        run: |
          set -eux
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            cmake \
            curl \
            flex \
            gawk \
            gettext \
            git \
            gperf \
            lib32stdc++6 \
            lib32z1 \
            lib32z1-dev \
            libcurl4-openssl-dev \
            libtool \
            meson \
            ninja-build \
            openjdk-17-jdk \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Android command line tools and NDK r28c
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L -o /tmp/android-commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          ls -la "$ANDROID_SDK_ROOT/ndk"

      - name: Generate debug keystore
        run: |
          set -eux
          mkdir -p "$HOME/.android"
          keytool -genkey -keystore "$HOME/.android/debug.keystore" -v \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 || true

      - name: Bootstrap and configure Android depends
        run: |
          set -eux
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$TARBALLS" \
            --host="$HOST" \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/28.2.13676358" \
            --prefix="$DEPENDS_PREFIX" \
            --disable-ccache

      - name: Build Android depends
        run: |
          set -eux
          make -C tools/depends V=1

      - name: Verify libbluray and udfread depends output
        run: |
          set -eux
          echo "== depends lib dir =="
          find "$DEPENDS_PREFIX" -maxdepth 4 \( -iname '*bluray*' -o -iname '*udf*' -o -iname '*aacs*' -o -iname '*bdplus*' \) -print | sort || true
          echo "== depends pkgconfig/cmake hints =="
          find "$DEPENDS_PREFIX" -maxdepth 6 \( -iname '*bluray*.pc' -o -iname '*udf*.pc' -o -iname '*aacs*.pc' -o -iname '*bdplus*.pc' -o -iname '*bluray*config*.cmake' \) -print | sort || true

      - name: Configure Kodi CMake build
        if: env.BUILD_MODE == 'full-apk'
        run: |
          set -eux
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$BUILD_DIR"

      - name: Build Kodi
        if: env.BUILD_MODE == 'full-apk'
        run: |
          set -eux
          make -C "$BUILD_DIR"

      - name: Check compiled Blu-ray defines
        if: env.BUILD_MODE == 'full-apk'
        run: |
          set -eux
          grep -R "HAVE_LIBBLURAY\|HAS_UDFREAD" "$BUILD_DIR" CMakeFiles 2>/dev/null | head -80 || true

      - name: Package APK
        if: env.BUILD_MODE == 'full-apk'
        run: |
          set -eux
          make -C "$BUILD_DIR" apk
          find "$GITHUB_WORKSPACE" -iname '*.apk' -print -exec ls -lh {} \;

      - name: Upload APKs
        if: env.BUILD_MODE == 'full-apk'
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-firetv-${{ github.ref_name }}-armv7-apk
          path: |
            **/*.apk
          if-no-files-found: warn

      - name: Upload configure/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-android-firetv-${{ github.ref_name }}-armv7-logs
          path: |
            tools/depends/config.log
            kodi-build/**/*.log
            xbmc-depends/**/*.log
          if-no-files-found: ignore
