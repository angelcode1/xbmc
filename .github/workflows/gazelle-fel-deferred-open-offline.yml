name: Gazelle FEL deferred-open source-only CI

on:
  push:
    branches:
      - research/gazelle-fel-deferred-open-offline-20261024
    paths:
      - .github/workflows/gazelle-fel-deferred-open-offline.yml
      - xbmc/cores/VideoPlayer/VideoPlayerVideo.cpp
      - xbmc/cores/VideoPlayer/VideoPlayerVideo.h
      - xbmc/cores/VideoPlayer/GazelleDeferredOpenPolicy.h
      - tests/TestGazelleDeferredStockPolicy.cpp
      - xbmc/utils/GazelleFELPrecreateProbe.h
      - tests/TestGazelleFELPrecreateProbe.cpp
      - tests/TestGazelleFELRealLibdovi.cpp
      - tests/stubs/libdovi/rpu_parser.h
      - tools/gazelle-fel/verify-deferred-open-source.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse unsafe source modification
        run: |
          set -euo pipefail
          python3 -S tools/gazelle-fel/verify-deferred-open-source.py --selftest
          python3 -S tools/gazelle-fel/verify-deferred-open-source.py
      - name: Compile real shared Kodi scheduling policy as C++17
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/TestGazelleDeferredStockPolicy.cpp -o /tmp/gazelle-deferred-policy
          /tmp/gazelle-deferred-policy
      - name: Repeat under UBSan
        run: |
          set -euo pipefail
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            tests/TestGazelleDeferredStockPolicy.cpp -o /tmp/gazelle-deferred-ubsan
          /tmp/gazelle-deferred-ubsan
      - name: Compile and test P7 first-AU probe using FAKE libdovi ABI
        run: |
          set -euo pipefail
          # Explicit stub: tests safe framing/cleanup/control flow, not real RPU semantics.
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Itests/stubs tests/TestGazelleFELPrecreateProbe.cpp -o /tmp/gazelle-rpu-probe-stub
          /tmp/gazelle-rpu-probe-stub
      - name: Compile fake RPU probe under UBSan
        run: |
          set -euo pipefail
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Itests/stubs tests/TestGazelleFELPrecreateProbe.cpp -o /tmp/gazelle-rpu-probe-ubsan
          /tmp/gazelle-rpu-probe-ubsan
      - name: Explicit limitation notice
        run: |
          echo 'GAZELLE_KODI_DEFERRED_OFFLINE_CI_PASS compiled_shared_policy=true'
          echo 'FULL_KODI_ANDROID_BUILD=NOT_TESTED'
          echo 'MEDIACODEC_RUNTIME=NOT_TESTED'
          echo 'FEL_RPU_PARSER=SOURCE_CONNECTED_DISABLED_REAL_LIBDOVI_NOT_RUNTIME_TESTED'
          echo 'CUBE_UNTOUCHED=true'

  real-libdovi-abi:
    # Use the OS that actually packages 3.3.2; Ubuntu 24.04 ships no libdovi-dev.
    # This is a host ABI check only, not a Kodi or Android build.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 12
    steps:
      - name: Install real packaged libdovi 3.3.2 and C++ compiler
        run: |
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ libdovi-dev pkg-config
          dpkg-query -W -f='libdovi-dev=${Version}\n' libdovi-dev
          test "$(dpkg-query -W -f='${Version}' libdovi-dev | cut -d- -f1)" = "3.3.2"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile/link/execute production first-AU probe against REAL libdovi
        run: |
          set -eu
          test -f /usr/include/libdovi/rpu_parser.h
          echo '=== REAL LIBDOVI 3.3.2 HEADER DECLARATIONS ==='
          sed -n '1,220p' /usr/include/libdovi/rpu_parser.h
          echo '=== PACKAGE CONTENTS ==='
          dpkg -L libdovi-dev | grep -E 'libdovi|\.h$|\.pc          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/TestGazelleFELRealLibdovi.cpp -ldovi -o /tmp/gazelle-real-libdovi
          ldd /tmp/gazelle-real-libdovi | grep -F libdovi
          /tmp/gazelle-real-libdovi
          echo 'GAZELLE_REAL_LIBDOVI_HOST_ABI_GATE_PASS full_kodi_build=false real_FEL_fixture=false no_device=true'

          echo '=== LIBRARY EXPORTED FUNCTIONS ==='
          nm -D /usr/lib/x86_64-linux-gnu/libdovi.so | grep -E 'dovi_parse_unspec62_nalu|dovi_rpu_get_header|dovi_rpu_free' || true
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            tests/TestGazelleFELRealLibdovi.cpp -ldovi -o /tmp/gazelle-real-libdovi
          ldd /tmp/gazelle-real-libdovi | grep -F libdovi
          /tmp/gazelle-real-libdovi
          echo 'GAZELLE_REAL_LIBDOVI_HOST_ABI_GATE_PASS full_kodi_build=false real_FEL_fixture=false no_device=true'
