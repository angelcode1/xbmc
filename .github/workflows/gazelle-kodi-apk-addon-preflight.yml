name: Gazelle Kodi APK Packaging Source Gate

on:
  push:
    branches:
      - android-firetv-fel
    paths:
      - .github/workflows/gazelle-kodi-apk-addon-preflight.yml
      - tools/android/packaging/gazelle/**
      - .github/workflows/android-firetv-bluray.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonsecret-packaging-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify staging and APK integrity checkers compile
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/android/packaging/gazelle/prepare_optical_addons.py \
            tools/android/packaging/gazelle/verify_optical_apk.py
          python3 - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/android-firetv-bluray.yml").read_text()
          for name in ("Checkout pinned cube3 optical Kodi addon sources",
                       "Compile and embed ARMv7 Gazelle optical Kodi addons",
                       "Verify Gazelle addons actually exist inside APK"):
              assert name in wf, name
          assert "workflow_call:" in wf
          assert wf.count("github.repository == 'angelcode1/cube3'") == 3
          assert "CUBE3_READ_TOKEN" not in wf
          print("GAZELLE_PUBLIC_KODI_OPTICAL_PACKAGING_SOURCE_PASS")
          PY
