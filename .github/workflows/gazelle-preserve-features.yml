name: Gazelle - preserve AACS and Dolby FEL integration

on:
  pull_request:
    branches:
      - android-firetv-unified
  push:
    branches:
      - android-firetv-unified
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-gazelle:
    name: Require both Blu-ray and FEL source gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proposed or current unified Kodi source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and build contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "GAZELLE_INTEGRATION_GUARD_START"

          # AACS / physical optical / MakeMKV bridge path.
          test -f tools/depends/target/libbluray/gazelle-aacs-gate-v1.py
          test -f tools/depends/target/libbluray/005-android-libmmbd-unversioned-dlopen.patch
          grep -Fq 'gazelle-aacs-gate-v1.py' tools/depends/target/libbluray/Makefile
          grep -Fq 'GAZELLE_AACS_GATE_V1' tools/depends/target/libbluray/gazelle-aacs-gate-v1.py
          test -f xbmc/cores/VideoPlayer/DVDInputStreams/DVDInputStreamBluray.cpp
          test -f xbmc/settings/MediaSourceSettings.cpp
          test -f tools/depends/target/udfread/002-primary-first-metadata.patch
          test -f addons/plugin.video.gazelle.kerneludf/addon.xml
          test -f addons/plugin.video.gazelle.kerneludf/default.py
          test -f tools/android/packaging/gazelle/stage_kernel_addon.py
          test -f tools/android/packaging/gazelle/verify_kernel_apk.py
          test ! -f tools/android/packaging/gazelle/prepare_optical_addons.py
          test ! -f tools/android/packaging/gazelle/verify_optical_apk.py
          grep -Fq GAZELLE_KERNEL_UDF_FILESMODE xbmc/cores/VideoPlayer/DVDInputStreams/DVDInputStreamBluray.cpp
          # Kodi's PosixFile::Exists never reports directories as files.
          # Optical shortcuts must be available before a disc is mounted.
          ! grep -Fq 'if (!CFileUtils::Exists(DISC_ROOT))' xbmc/settings/MediaSourceSettings.cpp
          grep -Fq 'Register Gazelle disc shortcuts on every Kodi startup' xbmc/settings/MediaSourceSettings.cpp
          grep -Fq 'ensureSource(GetSources(MediaSection::VIDEO), "Blu-ray Disc"' xbmc/settings/MediaSourceSettings.cpp
          grep -Fq 'ensureSource(GetSources(MediaSection::PICTURES), "Disc Pictures"' xbmc/settings/MediaSourceSettings.cpp
          grep -Fq 'ensureSource(GetSources(MediaSection::MUSIC), "Audio CD"' xbmc/settings/MediaSourceSettings.cpp
          grep -Fq 'ensureSource(GetSources(MediaSection::MUSIC), "Disc Music Files"' xbmc/settings/MediaSourceSettings.cpp
          echo "GAZELLE_AACS_SOURCE_PRESERVED_PASS"

          # Dolby Vision P7 and native OMX analysis/configuration.
          video=xbmc/cores/VideoPlayer/DVDCodecs/Video/DVDVideoCodecAndroidMediaCodec.cpp
          test -f "$video"
          grep -Fq 'GAZELLE_DOVI_CAPABILITIES' "$video"
          grep -Fq 'GAZELLE_DOVI_MEDIAFORMAT' "$video"
          grep -Fq 'm_hints.dovi.el_present_flag' "$video"
          test -f tools/gazelle-fel/audit-stagefright-profile-read.py
          test -f docs/gazelle-fel-stagefright-profile-handoff-2026-10-14.md
          echo "GAZELLE_FEL_SOURCE_PRESERVED_PASS"

          # The Kodi APK must package the kernel UDF addon from this repository.
          workflow=.github/workflows/android-firetv-bluray.yml
          test -f "$workflow"
          grep -Fq 'android-firetv-unified' "$workflow"
          grep -Fq 'stage_kernel_addon.py' "$workflow"
          echo "GAZELLE_COMBINED_BUILD_CONTRACT_PRESERVED_PASS"
          echo "GAZELLE_SYNC_PRESERVATION_GATE_PASS aacs=1 fel=1 build=1"
