name: Gazelle Fire OS FEL onset source gate

on:
  push:
    branches:
      - research/gazelle-fireos-fel-20261019
    paths:
      - .github/workflows/gazelle-fireos-fel-onset-source.yml
      - tools/gazelle-fel/capture-fireos-vendor-onset.sh
      - docs/gazelle-fireos-fel-coreelec-t7-20261019.md
      - docs/gazelle-fel-coreelec-stream-contract-20261019.md
      - tools/gazelle-fel/audit-fireos-profile-boundary.py
      - tools/gazelle-fel/audit-stage12-port-pair.py
      - tools/gazelle-fel/capture-stage13-live-ports.sh
      - tools/gazelle-fel/audit-stage15-mvc-index.py
      - tools/gazelle-fel/audit-stage16-omx-mode-contract.py
      - tools/gazelle-fel/audit-stage17-native-abi.py
      - tools/gazelle-fel/audit-stage18-native-layout.py
      - tools/gazelle-fel/audit-stage19-config-lifecycle.py
      - tools/gazelle-fel/audit-stage20-kernel-config.py
      - tools/gazelle-fel/audit-stage21-pair-lifecycle.py
      - tools/gazelle-fel/audit-stage22-hevc-role.py
      - tools/gazelle-fel/audit-stage23-aux-data.py
      - tools/gazelle-fel/audit-stage24-metadata-path.py
      - tools/gazelle-fel/audit-stage25-dovi-registration.py
      - tools/gazelle-fel/audit-stage26-public-dv-receiver.py
      - tools/gazelle-fel/capture-stage27-readonly.py
      - tools/gazelle-fel/capture-stage28-active-comparison.py
      - tools/gazelle-fel/audit-stage29-live-gates.py
      - tools/gazelle-fel/audit-stage30-vendor-profile.py
      - tools/gazelle-fel/audit-stage31-config-ack.py
      - tools/gazelle-fel/run-stage31-macos.sh
      - docs/gazelle-fel-stage31-original-hevc-config-ack-20261020.md
      - tools/gazelle-fel/extract-stage30-vendor.py
      - tools/gazelle-fel/run-stage30-macos.sh
      - docs/gazelle-fel-stage30-original-vendor-profile-gates-20261020.md
      - tools/gazelle-fel/run-stage29-macos.sh
      - docs/gazelle-fel-stage29-active-profile-decision-20261019.md
      - tools/gazelle-fel/run-stage28-macos.sh
      - docs/gazelle-fel-stage28-active-p7-p8-comparison-20261019.md
      - docs/gazelle-fel-stage27-installed-resolver-readonly-20261019.md
      - docs/gazelle-fel-stage26-public-dv-receiver-20261019.md
      - docs/gazelle-fel-stage25-dovi-registration-20261019.md
      - docs/gazelle-fel-stage24-metadata-dma-export-20261019.md
      - docs/gazelle-fel-stage23-aux-data-selector-20261019.md
      - docs/gazelle-fel-stage22-hevc-role-metadata-20261019.md
      - docs/gazelle-fel-stage21-paired-decoder-lifecycle-20261019.md
      - docs/gazelle-fel-stage20-kernel-config-receiver-20261019.md
      - docs/gazelle-fel-stage19-native-config-ioctl-20261019.md
      - docs/gazelle-fel-stage18-vendor-named-context-layout-20261019.md
      - docs/data/gazelle-fel-stage18-codec-para-fields.json
      - docs/gazelle-fel-stage17-native-abi-contract-20261019.md
      - docs/gazelle-fel-stage16-instance-mode-contract-20261019.md
      - docs/gazelle-fel-stage15-mvc-overlap-20261019.md
      - docs/gazelle-fel-stage13-live-port-state-gate-20261019.md
      - docs/gazelle-fel-stage12-porttype-dolby-hevc-pairing-20261019.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and fail-closed read-only device operations
        run: |
          set -euo pipefail
          f=tools/gazelle-fel/capture-fireos-vendor-onset.sh
          bash -n "$f"
          python3 - <<'PY'
          from pathlib import Path
          f=Path("tools/gazelle-fel/capture-fireos-vendor-onset.sh")
          text=f.read_text()
          code="\n".join(line for line in text.splitlines() if not line.lstrip().startswith("#"))
          for forbidden in ["logcat -c", "adb push", "setprop ", "su -c 'echo ", "mount -t ", "umount ", "insmod ", "modprobe ", "stop media.codec"]:
              assert forbidden not in code, forbidden
          assert 'logcat -b main -b system -T 1' in code
          assert 'su -c' in code
          assert 'snapshot active' in code
          print("GAZELLE_FEL_ONSET_READONLY_SOURCE_PASS")
          PY
          python3 -m py_compile tools/gazelle-fel/audit-fireos-profile-boundary.py
          python3 tools/gazelle-fel/audit-fireos-profile-boundary.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage12-port-pair.py
          python3 tools/gazelle-fel/audit-stage12-port-pair.py --selftest
          bash -n tools/gazelle-fel/capture-stage13-live-ports.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tools/gazelle-fel/capture-stage13-live-ports.sh").read_text()
          code="\n".join(l for l in s.splitlines() if not l.lstrip().startswith("#"))
          for bad in ("setprop ", "logcat -c", "adb push", "insmod ", "modprobe ", "echo 1 >", "pm install", "force-stop"):
              assert bad not in code, bad
          assert 'cat /sys/class/amstream/ports' in code
          assert 'active-1' in code and 'active-2' in code
          print("GAZELLE_STAGE13_HOST_CAPTURE_SOURCE_PASS")
          PY
          python3 -m py_compile tools/gazelle-fel/audit-stage15-mvc-index.py
          python3 tools/gazelle-fel/audit-stage15-mvc-index.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage16-omx-mode-contract.py
          python3 tools/gazelle-fel/audit-stage16-omx-mode-contract.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage17-native-abi.py
          python3 tools/gazelle-fel/audit-stage17-native-abi.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage18-native-layout.py
          python3 tools/gazelle-fel/audit-stage18-native-layout.py --selftest
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('docs/data/gazelle-fel-stage18-codec-para-fields.json').read_text())
          assert j['named_field_count']==40 and len(j['fields'])==40
          assert j['bounds']['minimum_observed_context_bytes']==4804
          assert j['bounds']['exact_size']=='UNKNOWN'
          assert {x['field']:x['offset_decimal'] for x in j['fields']}['decoder_type']==0x10a0
          print('GAZELLE_STAGE18_LAYOUT_JSON_SOURCE_PASS')
          PY
          python3 -m py_compile tools/gazelle-fel/audit-stage19-config-lifecycle.py
          python3 tools/gazelle-fel/audit-stage19-config-lifecycle.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage20-kernel-config.py
          python3 tools/gazelle-fel/audit-stage20-kernel-config.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage21-pair-lifecycle.py
          python3 tools/gazelle-fel/audit-stage21-pair-lifecycle.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage22-hevc-role.py
          python3 tools/gazelle-fel/audit-stage22-hevc-role.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage23-aux-data.py
          python3 tools/gazelle-fel/audit-stage23-aux-data.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage24-metadata-path.py
          python3 tools/gazelle-fel/audit-stage24-metadata-path.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage25-dovi-registration.py
          python3 tools/gazelle-fel/audit-stage25-dovi-registration.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage26-public-dv-receiver.py
          python3 tools/gazelle-fel/audit-stage26-public-dv-receiver.py --selftest
          python3 -m py_compile tools/gazelle-fel/capture-stage27-readonly.py
          python3 tools/gazelle-fel/capture-stage27-readonly.py --selftest
          python3 -m py_compile tools/gazelle-fel/capture-stage28-active-comparison.py
          python3 tools/gazelle-fel/capture-stage28-active-comparison.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage29-live-gates.py
          python3 tools/gazelle-fel/audit-stage29-live-gates.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage30-vendor-profile.py
          python3 tools/gazelle-fel/audit-stage30-vendor-profile.py --selftest
          python3 -m py_compile tools/gazelle-fel/audit-stage31-config-ack.py
          python3 tools/gazelle-fel/audit-stage31-config-ack.py --selftest
          bash -n tools/gazelle-fel/run-stage31-macos.sh
          python3 - <<'PY'
          from pathlib import Path
          checker = Path("tools/gazelle-fel/audit-stage31-config-ack.py").read_text()
          runner = Path("tools/gazelle-fel/run-stage31-macos.sh").read_text()
          assert "GATES =" in checker and "CONFIG_IOCTL_RETURN_ERROR=LOGGED_BUT_HELPER_RETURNS_ZERO" in checker
          assert "EXPECTED_BLOB=b8371b0b2a74590b5535c134a2b9347a7062e901" in runner
          assert not any(token in runner for token in ("adb shell", "setprop ", "insmod ", "pm install", "logcat -c"))
          print("GAZELLE_FEL_STAGE31_SOURCE_SAFETY_PASS")
          PY
          python3 -m py_compile tools/gazelle-fel/extract-stage30-vendor.py
          bash -n tools/gazelle-fel/run-stage30-macos.sh
          python3 - <<'PY'
          from pathlib import Path
          e=Path('tools/gazelle-fel/extract-stage30-vendor.py').read_text()
          r=Path('tools/gazelle-fel/run-stage30-macos.sh').read_text()
          for s in (e,r):
              for forbidden in ('adb shell', 'setprop ', 'logcat -c', 'insmod ', 'modprobe ', 'pm install'):
                  assert forbidden not in s, forbidden
          assert 'PRIVATE=' in r and 'SCRIPT_PIN_PASS' in r
          assert 'PINS' in e and 'file_sha(image)' in e
          print('GAZELLE_STAGE30_OFFLINE_SOURCE_SAFETY_PASS')
          PY
          bash -n tools/gazelle-fel/run-stage29-macos.sh
          bash -n tools/gazelle-fel/run-stage28-macos.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tools/gazelle-fel/capture-stage28-active-comparison.py").read_text()
          assert "SAMPLES = 3" in s and 'PHASES = ("idle", "P8", "P7")' in s
          assert 'read-only' in s
          assert 'GAZELLE_FEL_STAGE28_SOURCE_SELFTEST_PASS' in s
          for bad in ("setprop ", "adb push", "pm install", "logcat -c", "insmod ", "modprobe ", "am force-stop", "setenforce "):
              assert bad not in s, bad
          print("GAZELLE_FEL_STAGE28_SOURCE_SAFETY_PASS")
          PY
          PUBLIC="$RUNNER_TEMP/gazelle-fel-stage26-public"
          COMMIT=24a1e36b68d5319f7c4e94a2d6d1badf9f92ba7f
          for path in \
            drivers/amlogic/media/enhancement/amdolby_vision/amdolby_vision.c \
            drivers/amlogic/media/enhancement/amdolby_vision/amdolby_vision.h \
            include/linux/amlogic/media/amdolbyvision/dolby_vision.h
          do
            mkdir -p "$PUBLIC/$(dirname "$path")"
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/TCLOpenSource/a311d2/$COMMIT/$path" \
              -o "$PUBLIC/$path"
          done
          python3 tools/gazelle-fel/audit-stage26-public-dv-receiver.py "$PUBLIC"
