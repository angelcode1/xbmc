name: Gazelle Kernel UDF APK Source Gate

on:
  push:
    branches:
      - android-firetv-unified
      - feature/gazelle-kernel-udf-disc-tiles-20261017
    paths:
      - .github/workflows/gazelle-kodi-apk-addon-preflight.yml
      - .github/workflows/android-firetv-bluray.yml
      - tools/android/packaging/gazelle/**
      - addons/plugin.video.gazelle.kerneludf/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-addon-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage and inspect the kernel UDF addon offline
        run: |
          set -euo pipefail
          python3 -m py_compile tools/android/packaging/gazelle/stage_kernel_addon.py tools/android/packaging/gazelle/verify_kernel_apk.py addons/plugin.video.gazelle.kerneludf/default.py
          python3 tools/android/packaging/gazelle/stage_kernel_addon.py --root "$GITHUB_WORKSPACE" --depends-prefix "$RUNNER_TEMP/staged"
          mkdir -p "$RUNNER_TEMP/apk-assets/system"
          cp system/addon-manifest.xml "$RUNNER_TEMP/apk-assets/system/addon-manifest.xml"
          python3 tools/android/packaging/gazelle/stage_kernel_addon.py --root "$GITHUB_WORKSPACE" --assets "$RUNNER_TEMP/apk-assets"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apk-assets'
          with zipfile.ZipFile('/tmp/gazelle-kernel-test.apk', 'w') as archive:
              for src in root.rglob('*'):
                  if src.is_file():
                      archive.write(src, 'assets/' + str(src.relative_to(root)))
          PY
          python3 tools/android/packaging/gazelle/verify_kernel_apk.py /tmp/gazelle-kernel-test.apk --kernel-only
          grep -Fq 'stage_kernel_addon.py --root $(CMAKE_SOURCE_DIR) --assets ./assets' tools/android/packaging/Makefile.in
          python3 -m py_compile tools/android/packaging/gazelle/stage_mmbd_apk.py addons/service.gazelle.mmbd/service.py
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path("tools/android/packaging/gazelle/native")
          lib = root / "libmmbd.so"
          assert lib.is_file() and hashlib.sha256(lib.read_bytes()).hexdigest() == "826b5e6dfebfd628c1a6f851a22cb583fa831978600f4ddc2663af46794a8d0b"
          assert (root / "gazelle_mmbd_helper_v2.c").is_file()
          assert pathlib.Path("addons/service.gazelle.mmbd/service.py").is_file()
          print("GAZELLE_MMBD_SOURCE_LOCAL_PASS")
          PY
          sh -n tools/android/packaging/gazelle/kodi-uid-provision.sh
          bash -n tools/android/packaging/gazelle/kodi-clean-install-macos.sh
          sh tools/android/packaging/gazelle/kodi-uid-provision.sh --selftest
          # Never allow recursive modification or automatic mount changes.
          ! grep -Eq 'chown[[:space:]]+-R|chcon[[:space:]]+-R|umount[[:space:]]|mount[[:space:]]+-t' tools/android/packaging/gazelle/kodi-uid-provision.sh
          grep -Fq 'kodi-uid-provision.sh' .github/workflows/android-firetv-bluray.yml
          ! grep -Eiq 'angelcode1/cube3|CUBE3_READ_TOKEN|gazelle-cube3-optical' .github/workflows/android-firetv-bluray.yml
          echo GAZELLE_SELF_CONTAINED_KERNEL_ADDON_PASS
